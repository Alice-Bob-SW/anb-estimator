[project]
name = "anb-estimator"
description = "Resource estimator for quantum algorithms on Alice & Bob's cat-qubit architecture"
readme = "README.md"
authors = [
    { name = "Alice & Bob", email = "contact@alice-bob.com" },
]
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = ["qualtran>=0.4.0"]

[project.urls]
Repository = "https://github.com/Alice-Bob-SW/anb-estimator"
"Alice & Bob" = "https://alice-bob.com"

[project.scripts]
anb-estimator = "anb_estimator.__main__:main"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python"]
module-name = "anb_estimator._native"

[tool.ruff]
line-length = 100
target-version = "py311"

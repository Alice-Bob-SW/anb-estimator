name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  build_and_test:
    name: Check, compile, run and doc - ${{matrix.os}} - ${{matrix.toolchain}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v7
      - name: Install rust (${{matrix.os}}-${{matrix.toolchain}})
        run: rustup update ${{matrix.toolchain}} && rustup default ${{matrix.toolchain}}
      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            target
          key: ${{runner.os}}-cargo-${{github.sha}}
          restore-keys: ${{runner.os}}-cargo-
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: Build debug
        run: cargo build
      - name: build release
        run: cargo build --release
      - name: Save executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.os}}-anb_estimator_cli
          path: target/release/anb_estimator_cli${{ runner.os == 'Windows' && '.exe' || ''}}
      - name: test
        run: cargo test
      - name: example elliptic_log
        run: cargo run --example=elliptic_log
      - name: example from_qsharp
        run: cargo run --example=from_qsharp
      - name: doc
        run: cargo doc --release --no-deps
      - name: Save doc
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.os}}-doc
          path: target/doc

  python:
    name: Python build & lint - ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        # Matches the platforms declared in pixi.toml (linux-64, osx-arm64, win-64).
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up pixi (Linux/macOS)
        # `prefix-dev/setup-pixi` is not allowed here: all actions must come from
        # a repository owned by Alice-Bob-SW or created by GitHub.
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Set up pixi (Windows)
        if: runner.os == 'Windows'
        run: |
          iwr -useb https://pixi.sh/install.ps1 | iex
          echo "$env:USERPROFILE\.pixi\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh
      - name: Install environment and build the native extension
        run: pixi install -e dev
      - name: Ruff lint
        run: pixi run -e dev ruff check anb_estimator
      - name: Ruff format check
        run: pixi run -e dev ruff format --check anb_estimator
      - name: ty check
        run: pixi run -e dev ty check anb_estimator
      - name: Import smoke test
        run: pixi run -e dev python -c "import anb_estimator; from anb_estimator import estimate_logical_counts, LogicalCounts; print('anb_estimator import OK')"


[package]
name = "anb-estimator"
version = "0.3.0"
edition = "2024"
description = "A resource estimator for running quantum algorithms on Alice and Bob's hardware."
license = "MIT"
readme = "Readme.md"
keywords = ["quantum", "qsharp", "resource-estimation"]
categories = ["science"]

[lib]
# Build both the normal Rust lib and the Python extension (.so/.pyd)
name = "anb_estimator"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "anb_estimator_cli"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ['cli']
python = ["dep:pyo3", "pyo3/extension-module", "dep:serde", "dep:serde_json"]
cli = ["dep:clap", "dep:serde", "dep:serde_json"]


[dependencies]
pyo3 = { version = "0.29.2", optional = true }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"], optional = true}
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
num-bigint = "0.4"
num-complex = "0.4.6"
num-traits = "0.2.19"
qsc = { git = "https://github.com/microsoft/qdk.git", tag = "v1.32.0" }
resource_estimator = { git = "https://github.com/microsoft/qdk.git", tag = "v1.32.0" }
num-format = "0.4.4"


[lints.clippy]
mod_module_files = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
